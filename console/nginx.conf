# How the finished console is served inside its container.
#
# Two jobs:
#   1. Hand out the built files (HTML, JavaScript, CSS, fonts).
#   2. Forward /api requests to the backend container, so the browser still sees a single
#      site on one port. That is what Vite's dev server does with its proxy; cookies and
#      CSRF work for the same reason, and no CORS setup is needed.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's own DNS. Looking the backend up through it, by way of the variable below,
    # means nginx re-checks the address instead of remembering it from startup: the
    # console survives the backend being restarted and given a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8080";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The live feed: one HTTP response the server keeps writing to (Server-Sent Events).
    # Buffering would hold decisions back until the buffer filled, which for a feed that
    # must look live is the one thing we cannot have. Hence: no buffering, no gzip, no
    # read timeout short enough to cut a quiet stream off.
    location = /api/stream/decisions {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else the console asks the backend for: sign-in, decisions, rules, audit.
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite stamps a content hash into every file name under /assets, so a given file never
    # changes. Those can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what points at the current /assets names, so
    # a stale copy would keep loading a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The console is a single-page app: /decisions and /rules are routes it draws itself,
    # not files on disk. Anything we do not recognise is answered with index.html and the
    # app takes it from there (it has its own "page not found").
    location / {
        try_files $uri $uri/ /index.html;
    }
}
