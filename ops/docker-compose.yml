# Postgres and Redis only, for working on the code: the Spring app and the console run
# outside Docker, from your IDE or ./mvnw and npm run dev, so you can debug them.
#
# To run the whole of Sentinel in Docker instead, use the docker-compose.yml in the repo
# root. Only one of the two at a time: both use ports 5432 and 6379.
#
# From the repo root:
#
#   docker compose -f ops/docker-compose.yml up -d                                start Postgres + Redis
#   docker compose -f ops/docker-compose.yml down                                 stop everything (data kept)
#   docker compose -f ops/docker-compose.yml down -v                              stop and wipe the database

name: sentinel

services:
  postgres:
    image: postgres:18-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data one level up from older versions
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    # counters are rebuilt by live traffic, so there is nothing worth saving to disk
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
