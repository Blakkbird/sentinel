# Settings Spring Boot reads at startup. Any key can be overridden with an environment
# variable: upper case, dots and dashes become underscores
# (spring.datasource.url -> SPRING_DATASOURCE_URL).

spring:
  application:
    name: sentinel

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    username: sentinel
    password: sentinel
    hikari:
      maximum-pool-size: 10      # more connections is usually slower, not faster
      connection-timeout: 2000   # ms to wait for a free connection before giving up

  flyway:
    enabled: true                # applies db/migration/*.sql on startup, in order

  jpa:
    open-in-view: false          # database work happens inside services, never while writing a response
    hibernate:
      ddl-auto: none             # Flyway owns the schema; Hibernate never creates or changes tables

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 50ms              # hard cap per Redis command; a slow Redis must not eat the latency budget
      connect-timeout: 200ms
      repositories:
        enabled: false           # Redis holds counters only; no Spring Data repositories live there

  threads:
    virtual:
      enabled: false             # stage 6 experiment: set true, re-run the load test, compare

server:
  shutdown: graceful             # on stop, finish in-flight decisions before exiting
  servlet:
    session:
      cookie:
        same-site: lax           # the session cookie is not sent along with requests from other sites

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true            # adds /actuator/health/liveness and /actuator/health/readiness
      group:
        readiness:
          # "Can this instance take traffic?" depends only on Postgres. Without Redis we
          # still decide (degraded mode), so a Redis outage must not pull us out of service.
          # /actuator/health still reports Redis, so the outage stays visible.
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html       # a web page for trying the API from the browser
  paths-to-match: /v1/**         # document the payment API, not the console's own endpoints

# Console accounts and the API key created on first start, if they do not exist yet.
# The defaults are for local development only. Set the environment variables to something
# else before deploying anywhere, and never commit real values.
sentinel:
  bootstrap:
    api-key: ${SENTINEL_API_KEY:dev-sentinel-key}
    users:
      - username: analyst
        display-name: Neha Kapoor
        role: ANALYST
        password: ${SENTINEL_ANALYST_PASSWORD:sentinel-analyst}
      - username: admin
        display-name: Arjun Rao
        role: ADMIN
        password: ${SENTINEL_ADMIN_PASSWORD:sentinel-admin}
