# Continuous integration: GitHub runs this on every push to main and on every pull
# request. Branch protection is not switched on for this repository (a team choice), so
# GitHub itself will not block a merge when this fails. Keeping main working is our own
# rule instead: nobody merges a pull request until this run is green.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven            # reuse downloaded libraries between runs

      # "verify" compiles, runs every test, and packages the app. The integration tests
      # start their own Postgres and Redis containers; GitHub's runners have Docker.
      # chmod: a file committed from Windows can lose its "executable" flag.
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      # npm ci installs exactly what package-lock.json lists. "build" type-checks every
      # file with TypeScript, then bundles the app, so a type error fails the pull request.
      - run: npm ci
      - run: npm run build
